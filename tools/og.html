<style>

const zh = location.search.includes('zh'); document.body.className = zh ? 'zh' : 'en';
h.innerHTML = zh ? 'GitHub 今日最热<br><em>10 个仓库</em>，倒数解说' : 'GitHub’s 10 hottest<br>repos, <em>counted down</em><br>in video';

// 确定性星点（固定种子），亮星带十字星芒
let x = 7; const r = () => (x = (x * 16807) % 2147483647) / 2147483647, g = c.getContext('2d');
for (let i = 0; i < 150; i++) { const px = r() * 1200, py = r() * 630, a = .35 + r() * .6, z = r() > .9 ? 3 : r() > .5 ? 2 : 1.4; g.fillStyle = `rgba(255,255,255,${a})`; g.fillRect(px, py, z, z);

</script>
